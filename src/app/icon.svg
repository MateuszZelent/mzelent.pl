<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d18" />
      <stop offset="100%" stop-color="#030405" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#9d84fc" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9d84fc" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#9d84fc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background acrylic rounded rect -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#cardGrad)" stroke="#9d84fc" stroke-opacity="0.45" stroke-width="1.2" />
  
  <!-- Ambient center glow -->
  <circle cx="16" cy="16" r="11" fill="url(#glow)" />

  <!-- Monogram MZ -->
  <text 
    x="16" 
    y="20.5" 
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" 
    font-size="12" 
    font-weight="800" 
    letter-spacing="-0.5" 
    fill="url(#textGrad)" 
    text-anchor="middle"
  >MZ</text>

  <!-- Precision quantum dot in luminous purple -->
  <circle cx="23" cy="9" r="1.5" fill="#bd68f8" />
</svg>

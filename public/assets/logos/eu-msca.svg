<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" aria-label="Co-funded by the European Union — Marie Skłodowska-Curie Actions">
  <!-- European Union Flag Box -->
  <rect x="12" y="16" width="72" height="48" rx="3" fill="#003399"/>
  <!-- 12 Stars of Europe (centered at 48, 40 with radius 16) -->
  <g fill="#FFCC00">
    <!-- 12 o'clock -->
    <polygon points="48,24 49,26.5 51.5,26.5 49.5,28 50.2,30.5 48,29 45.8,30.5 46.5,28 44.5,26.5 47,26.5"/>
    <!-- 1 o'clock -->
    <polygon points="56,26 57,28.5 59.5,28.5 57.5,30 58.2,32.5 56,31 53.8,32.5 54.5,30 52.5,28.5 55,28.5"/>
    <!-- 2 o'clock -->
    <polygon points="62,32 63,34.5 65.5,34.5 63.5,36 64.2,38.5 62,37 59.8,38.5 60.5,36 58.5,34.5 61,34.5"/>
    <!-- 3 o'clock -->
    <polygon points="64,40 65,42.5 67.5,42.5 65.5,44 66.2,46.5 64,45 61.8,46.5 62.5,44 60.5,42.5 63,42.5"/>
    <!-- 4 o'clock -->
    <polygon points="62,48 63,50.5 65.5,50.5 63.5,52 64.2,54.5 62,53 59.8,54.5 60.5,52 58.5,50.5 61,50.5"/>
    <!-- 5 o'clock -->
    <polygon points="56,54 57,56.5 59.5,56.5 57.5,58 58.2,60.5 56,59 53.8,60.5 54.5,58 52.5,56.5 55,56.5"/>
    <!-- 6 o'clock -->
    <polygon points="48,56 49,58.5 51.5,58.5 49.5,60 50.2,62.5 48,61 45.8,62.5 46.5,60 44.5,58.5 47,58.5"/>
    <!-- 7 o'clock -->
    <polygon points="40,54 41,56.5 43.5,56.5 41.5,58 42.2,60.5 40,59 37.8,60.5 38.5,58 36.5,56.5 39,56.5"/>
    <!-- 8 o'clock -->
    <polygon points="34,48 35,50.5 37.5,50.5 35.5,52 36.2,54.5 34,53 31.8,54.5 32.5,52 30.5,50.5 33,50.5"/>
    <!-- 9 o'clock -->
    <polygon points="32,40 33,42.5 35.5,42.5 33.5,44 34.2,46.5 32,45 29.8,46.5 30.5,44 28.5,42.5 31,42.5"/>
    <!-- 10 o'clock -->
    <polygon points="34,32 35,34.5 37.5,34.5 35.5,36 36.2,38.5 34,37 31.8,38.5 32.5,36 30.5,34.5 33,34.5"/>
    <!-- 11 o'clock -->
    <polygon points="40,26 41,28.5 43.5,28.5 41.5,30 42.2,32.5 40,31 37.8,32.5 38.5,30 36.5,28.5 39,28.5"/>
  </g>

  <!-- Typography -->
  <g fill="#f0f2f5">
    <text x="96" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.04em">Co-funded by the</text>
    <text x="96" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.02em">European Union</text>
    <text x="96" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" opacity="0.85" letter-spacing="0.03em">Marie Skłodowska-Curie Actions</text>
  </g>
</svg>
